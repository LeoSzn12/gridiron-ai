[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/api/yahoo-oauth"
  to = "/.netlify/functions/yahoo-oauth"
  status = 200

[[redirects]]
  from = "/api/yahoo-proxy"
  to = "/.netlify/functions/yahoo-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
